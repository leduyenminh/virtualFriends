# Magent Environment Configuration
# Copy this file to application-{profile}.yml for each environment

# Development Environment
spring:
  profiles: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/magent
    username: magentadmin
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080

logging:
  level:
    com.magent: DEBUG
    org.springframework.security: DEBUG

# Production Environment
---
spring:
  profiles: prod
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT:magent-prod.cluster-xxxxx.us-east-1.rds.amazonaws.com}:5432/magent
    username: magentadmin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

eureka:
  client:
    service-url:
      defaultZone: http://internal-magent-alb-xxxxx.us-east-1.elb.amazonaws.com/eureka/

server:
  port: 8080

logging:
  level:
    com.magent: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Staging Environment
---
spring:
  profiles: staging
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT:magent-staging.cluster-xxxxx.us-east-1.rds.amazonaws.com}:5432/magent
    username: magentadmin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://internal-magent-alb-xxxxx.us-east-1.elb.amazonaws.com/eureka/

server:
  port: 8080

logging:
  level:
    com.magent: INFO